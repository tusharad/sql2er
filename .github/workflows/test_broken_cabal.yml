name: test broken cabal

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Package and Haddock Docs to Hackage (curl ${{ matrix.curl_version }}, cabal ${{ matrix.cabal_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        curl_version: ['7.68.0', '7.81.0', '8.0.1', '8.4.0', '8.5.0', '8.8.0', '8.10.1', '8.12.0']
        cabal_version: ['3.6.2.0', '3.8.1.0', '3.10.2.1', '3.12.1.0', 'latest']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.4'
          cabal-version: ${{ matrix.cabal_version }}

      - name: Install specific curl version (${{ matrix.curl_version }})
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libnghttp2-dev libzstd-dev libpsl-dev wget
          wget https://curl.se/download/curl-${{ matrix.curl_version }}.tar.gz
          tar -xzf curl-${{ matrix.curl_version }}.tar.gz
          cd curl-${{ matrix.curl_version }}
          ./configure --prefix=/usr/local --with-ssl --with-nghttp2
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          which curl
          curl --version

      - name: Cache Cabal store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.6.4-cabal-${{ matrix.cabal_version }}-curl-${{ matrix.curl_version }}-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.6.4-cabal-${{ matrix.cabal_version }}-curl-${{ matrix.curl_version }}-

      - name: Verify package checks & tests
        run: |
          cabal update
          cabal check
          cabal test
      - name: Build Source Distribution Tarball
        run: |
          cabal sdist
      - name: Build Haddock Documentation Tarball for Hackage
        run: |
          cabal haddock --haddock-for-hackage --enable-doc
      - name: Upload Package to Hackage
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
        run: |
          SDIST_FILE=$(find dist-newstyle -name "sql2er-*.tar.gz" ! -name "*-docs.tar.gz" | head -n 1)
          echo "Publishing package ${SDIST_FILE} to Hackage..."
          cabal upload -u "${HACKAGE_USERNAME}" -p "${HACKAGE_PASSWORD}" "${SDIST_FILE}"
      - name: Upload Haddock Documentation to Hackage
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
        run: |
          DOCS_FILE=$(find dist-newstyle -name "sql2er-*-docs.tar.gz" | head -n 1)
          echo "Publishing Haddock documentation ${DOCS_FILE} to Hackage..."
          cabal upload --documentation -u "${HACKAGE_USERNAME}" -p "${HACKAGE_PASSWORD}" "${DOCS_FILE}"

